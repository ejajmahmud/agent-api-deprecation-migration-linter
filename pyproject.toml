[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-api-deprecation-migration-linter"
version = "0.1.0"
description = "Codemod engine applying pattern matching and transformation rules to automatically migrate deprecated library APIs to modern standards"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-api-deprecation-migration-linter = "agent_api_deprecation_migration_linter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_api_deprecation_migration_linter*"]
